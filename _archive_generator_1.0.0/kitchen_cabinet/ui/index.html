<!doctype html>
<html><head><meta charset="utf-8"><title>Kitchen Cabinet Generator</title><link rel="stylesheet" href="style.css"></head>
<body>
<header><div><h1>Kitchen Cabinet</h1><small id="active">No cabinet selected</small></div><button class="ghost" onclick="sketchup.refresh()">↻</button></header>
<main>
<section><h2>Cabinet</h2><div class="grid two"><label>Type<select id="type"><option value="single">Single Door</option><option value="double">Double Door</option></select></label><label>Width (mm)<input id="width" type="number"></label><label>Depth (mm)<input id="depth" type="number"></label><label>Height (mm)<input id="height" type="number"></label><label>Placement gap (mm)<input id="placement_gap" type="number"></label></div></section>
<section><h2>Construction</h2><div class="grid two"><label>Panel thickness<input id="panel_thickness" type="number"></label><label>Back thickness<input id="back_thickness" type="number"></label><label>Shutter thickness<input id="shutter_thickness" type="number"></label><label>Door gap<input id="door_gap" type="number" step="0.1"></label><label>Shutter distance / reveal<input id="shutter_distance" type="number" step="0.1"></label><label>Shelf thickness<input id="shelf_thickness" type="number"></label><label>Shelf depth reduction<input id="shelf_depth_reduction" type="number"></label><label>Shelf position<input id="shelf_position" type="number"></label><label>Number of shelves<input id="shelf_count" type="number" min="0" max="20"></label></div></section>
<section><h2>Door</h2><div class="grid two"><label>Opening angle<input id="opening_angle" type="number" min="0" max="180"></label><label>Door material<select id="door_material"><option value="">Default White</option></select></label></div><div class="row"><button onclick="sketchup.open_door()">Open</button><button onclick="sketchup.close_door()">Close</button></div><label class="check"><input id="show_opening_line" type="checkbox"> Show opening direction</label></section>
<section><h2>Toe Kick</h2><label class="check"><input id="toe_kick_enabled" type="checkbox"> Enable toe kick</label><div class="grid two"><label>Height<input id="toe_kick_height" type="number"></label><label>Thickness<input id="toe_kick_thickness" type="number"></label><label>Piece length<input id="toe_kick_length" type="number"></label><label>Finish<select id="toe_kick_mode"><option value="door">Door material</option><option value="pvc">PVC / Aluminium</option></select></label><label>PVC/Aluminium material<select id="toe_kick_material"><option value="">Default Gray</option></select></label></div></section>
<section><h2>Materials</h2><div class="grid"><label>Carcass material<select id="carcass_material"><option value="">Default White</option></select></label></div></section>
<section><h2>Visibility</h2><div class="checks"><label><input id="show_carcass" type="checkbox"> Carcass</label><label><input id="show_doors" type="checkbox"> Doors</label><label><input id="show_toe_kick" type="checkbox"> Toe kick</label><label><input id="show_shelves" type="checkbox"> Shelves</label><label><input id="show_back" type="checkbox"> Back panel</label></div></section>
<section><h2>Cabinet Management</h2><select id="cabinet_list" size="5" onchange="selectCabinet()"></select><div class="row"><button class="primary" onclick="insertCabinet()">Insert Cabinet</button><button onclick="updateCabinet()">Update</button></div><div class="row"><button onclick="sketchup.duplicate()">Duplicate</button><button class="danger" onclick="sketchup.delete()">Delete</button></div></section>
</main>
<footer><span>Parametric • Live Update • Y-axis placement</span></footer>
<script src="app.js"></script></body></html>
